name: astrbot_plugin_cmd_guard # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: 指令守卫 Command Guard # 用于展示的名字
desc: 拦截未知/被禁用的指令并禁止其触发 LLM 兜底回复；支持指令白名单与黑名单。
short_desc: 拦截未知/禁用指令，禁止 LLM 兜底
version: v1.1.0 # 插件版本号。格式：v1.1.1 或者 v1.1
author: Dawn_Nya # 作者
repo: https://github.com/Dawn-Nya/astrbot_plugin_cmd_guard # 插件的仓库地址
support_platforms: # 声明支持的平台适配器（ADAPTER_NAME_2_TYPE 的 key）
  - aiocqhttp
  - qq_official
  - qq_official_webhook
